<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" role="img" aria-labelledby="keys-title keys-desc">
  <title id="keys-title">hyprpeach keymap: SUPER moves your view, SUPER+SHIFT moves the window</title>
  <desc id="keys-desc">One rule covers the whole keymap. SUPER with a number goes to that desktop and SUPER with left or right steps to the one beside it, moving your view while the windows stay put. SUPER plus SHIFT with a number flings the focused window to that desktop, left and right fling it one along, and up or down flings it to the panel above or below; your view follows the window by default.</desc>
  <style>
    :root { color-scheme: light dark; }
    .surface   { fill: #F7F8FA; stroke: #D8DBE3; }
    .surface-2 { fill: #FFFFFF; stroke: #E4E7ED; }
    .chip      { fill: #EDEFF3; stroke: #DCE0E7; }
    .chip-on   { fill: #FF8A5B; stroke: #F2703C; }
    .chip-txt  { fill: #6B7280; }
    .chip-on-t { fill: #FFFFFF; }
    .h1        { fill: #171B24; }
    .h2        { fill: #171B24; }
    .muted     { fill: #6B7280; }
    .peach     { fill: #E9612B; }
    .warn      { fill: #D4453D; }
    .rule      { stroke: #E4E7ED; }
    .arrow     { stroke: #FF8A5B; fill: none; }
    .arrow-bad { stroke: #D4453D; fill: none; }
    .arrowhead { fill: #FF8A5B; }
    .arrowbad  { fill: #D4453D; }
    .keycap    { fill: #FFFFFF; stroke: #C9CDD6; }
    .keycap-t  { fill: #171B24; }
    .band      { fill: #FFF3ED; stroke: #FFD9C6; }
    @media (prefers-color-scheme: dark) {
      .surface   { fill: #171B22; stroke: #2E3542; }
      .surface-2 { fill: #0F1318; stroke: #262C36; }
      .chip      { fill: #1E242E; stroke: #2E3542; }
      .chip-on   { fill: #FF9E7A; stroke: #FFB595; }
      .chip-txt  { fill: #949CAB; }
      .chip-on-t { fill: #1A1208; }
      .h1        { fill: #EDEFF4; }
      .h2        { fill: #EDEFF4; }
      .muted     { fill: #949CAB; }
      .peach     { fill: #FF9E7A; }
      .warn      { fill: #F2766E; }
      .rule      { stroke: #262C36; }
      .arrow     { stroke: #FF9E7A; }
      .arrow-bad { stroke: #F2766E; }
      .arrowhead { fill: #FF9E7A; }
      .arrowbad  { fill: #F2766E; }
      .keycap    { fill: #1E242E; stroke: #3A4150; }
      .keycap-t  { fill: #EDEFF4; }
      .band      { fill: #2A1B13; stroke: #4A3025; }
    }
    text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .win     { fill: #FFFFFF; stroke: #C4643C; }
    @media (prefers-color-scheme: dark) { .win { fill: #FFFFFF; stroke: #8A4526; } }
  </style>
  <text x="28" y="40" class="h1" font-size="24" font-weight="700">One rule</text>
  <text x="152" y="40" class="muted" font-size="16"><tspan class="peach" font-weight="600">SUPER</tspan> moves you · <tspan class="peach" font-weight="600">SUPER + SHIFT</tspan> moves the window</text>
  <line x1="28" y1="60" x2="852" y2="60" class="rule" stroke-width="1"/>
  <text x="360" y="90" class="muted mono" font-size="11">THE DESKTOP STRIP  →</text>

  <text x="28" y="120" class="h2" font-size="14" font-weight="700">SUPER</text>
  <text x="28" y="143" class="peach" font-size="15" font-weight="700">moves your view</text>
  <text x="28" y="165" class="muted" font-size="12">windows stay where they are</text>
  <rect x="28" y="180" width="104" height="26" rx="6" class="keycap" stroke-width="1.5"/><text x="80" y="198" class="keycap-t mono" font-size="12" font-weight="600" text-anchor="middle">super + 1…9</text>
  <rect x="152" y="180" width="104" height="26" rx="6" class="keycap" stroke-width="1.5"/><text x="204" y="198" class="keycap-t mono" font-size="12" font-weight="600" text-anchor="middle">super + ← →</text>
    <rect x="360" y="108" width="68" height="62" rx="9" class="chip" stroke-width="1"/>
    <text x="394.0" y="134" class="chip-txt mono" font-size="14" font-weight="400" text-anchor="middle">1</text>
    <rect x="442" y="108" width="68" height="62" rx="9" class="chip-on" stroke-width="1.5"/>
    <text x="476.0" y="134" class="chip-on-t mono" font-size="14" font-weight="700" text-anchor="middle">2</text>
    <rect x="524" y="108" width="68" height="62" rx="9" class="chip" stroke-width="1"/>
    <text x="558.0" y="134" class="chip-txt mono" font-size="14" font-weight="400" text-anchor="middle">3</text>
    <rect x="606" y="108" width="68" height="62" rx="9" class="chip" stroke-width="1"/>
    <text x="640.0" y="134" class="chip-txt mono" font-size="14" font-weight="400" text-anchor="middle">4</text>
    <rect x="688" y="108" width="68" height="62" rx="9" class="chip" stroke-width="1"/>
    <text x="722.0" y="134" class="chip-txt mono" font-size="14" font-weight="400" text-anchor="middle">5</text>
  <path d="M 500 190 C 545 216, 612 216, 652 194" class="arrow" stroke-width="2.2" fill="none"/>
  <polygon points="648,188 662,193 647,200" class="arrowhead"/>
    <rect x="360" y="210" width="68" height="62" rx="9" class="chip" stroke-width="1"/>
    <text x="394.0" y="236" class="chip-txt mono" font-size="14" font-weight="400" text-anchor="middle">1</text>
    <rect x="442" y="210" width="68" height="62" rx="9" class="chip" stroke-width="1"/>
    <text x="476.0" y="236" class="chip-txt mono" font-size="14" font-weight="400" text-anchor="middle">2</text>
    <rect x="524" y="210" width="68" height="62" rx="9" class="chip" stroke-width="1"/>
    <text x="558.0" y="236" class="chip-txt mono" font-size="14" font-weight="400" text-anchor="middle">3</text>
    <rect x="606" y="210" width="68" height="62" rx="9" class="chip-on" stroke-width="1.5"/>
    <text x="640.0" y="236" class="chip-on-t mono" font-size="14" font-weight="700" text-anchor="middle">4</text>
    <rect x="688" y="210" width="68" height="62" rx="9" class="chip" stroke-width="1"/>
    <text x="722.0" y="236" class="chip-txt mono" font-size="14" font-weight="400" text-anchor="middle">5</text>

  <text x="28" y="325" class="h2" font-size="14" font-weight="700">SUPER + SHIFT</text>
  <text x="28" y="348" class="peach" font-size="15" font-weight="700">moves the window</text>
  <text x="28" y="370" class="muted" font-size="12">your view lands with it</text>
  <rect x="28" y="385" width="172" height="26" rx="6" class="keycap" stroke-width="1.5"/><text x="114" y="403" class="keycap-t mono" font-size="12" font-weight="600" text-anchor="middle">super + shift + 1…9</text>
  <rect x="212" y="385" width="37" height="26" rx="6" class="keycap" stroke-width="1.5"/><text x="231" y="403" class="keycap-t mono" font-size="12" font-weight="600" text-anchor="middle">← →</text>
    <rect x="360" y="313" width="68" height="62" rx="9" class="chip" stroke-width="1"/>
    <text x="394.0" y="339" class="chip-txt mono" font-size="14" font-weight="400" text-anchor="middle">1</text>
    <rect x="442" y="313" width="68" height="62" rx="9" class="chip-on" stroke-width="1.5"/>
    <text x="476.0" y="339" class="chip-on-t mono" font-size="14" font-weight="700" text-anchor="middle">2</text>
    <rect x="455" y="347" width="42" height="18" rx="4" class="win" stroke-width="1.5"/>
    <rect x="524" y="313" width="68" height="62" rx="9" class="chip" stroke-width="1"/>
    <text x="558.0" y="339" class="chip-txt mono" font-size="14" font-weight="400" text-anchor="middle">3</text>
    <rect x="606" y="313" width="68" height="62" rx="9" class="chip" stroke-width="1"/>
    <text x="640.0" y="339" class="chip-txt mono" font-size="14" font-weight="400" text-anchor="middle">4</text>
    <rect x="688" y="313" width="68" height="62" rx="9" class="chip" stroke-width="1"/>
    <text x="722.0" y="339" class="chip-txt mono" font-size="14" font-weight="400" text-anchor="middle">5</text>
  <path d="M 500 395 C 545 421, 612 421, 652 399" class="arrow" stroke-width="2.2" fill="none"/>
  <polygon points="648,393 662,398 647,405" class="arrowhead"/>
    <rect x="360" y="415" width="68" height="62" rx="9" class="chip" stroke-width="1"/>
    <text x="394.0" y="441" class="chip-txt mono" font-size="14" font-weight="400" text-anchor="middle">1</text>
    <rect x="442" y="415" width="68" height="62" rx="9" class="chip" stroke-width="1"/>
    <text x="476.0" y="441" class="chip-txt mono" font-size="14" font-weight="400" text-anchor="middle">2</text>
    <rect x="524" y="415" width="68" height="62" rx="9" class="chip" stroke-width="1"/>
    <text x="558.0" y="441" class="chip-txt mono" font-size="14" font-weight="400" text-anchor="middle">3</text>
    <rect x="606" y="415" width="68" height="62" rx="9" class="chip-on" stroke-width="1.5"/>
    <text x="640.0" y="441" class="chip-on-t mono" font-size="14" font-weight="700" text-anchor="middle">4</text>
    <rect x="619" y="449" width="42" height="18" rx="4" class="win" stroke-width="1.5"/>
    <rect x="688" y="415" width="68" height="62" rx="9" class="chip" stroke-width="1"/>
    <text x="722.0" y="441" class="chip-txt mono" font-size="14" font-weight="400" text-anchor="middle">5</text>

  <line x1="28" y1="495" x2="852" y2="495" class="rule" stroke-width="1"/>
  <text x="28" y="524" class="h2" font-size="14" font-weight="700">SUPER + SHIFT + ↑ ↓</text>
  <text x="28" y="546" class="muted" font-size="12.5">throws the window at the panel above or below,</text>
  <text x="28" y="564" class="muted" font-size="12.5">keeping the desktop it is already on.</text>
  <text x="28" y="592" class="muted" font-size="12">Left and right mean <tspan class="peach" font-weight="600">desktops</tspan>, because desktops are a strip.</text>
  <text x="28" y="610" class="muted" font-size="12">Up and down mean <tspan class="peach" font-weight="600">panels</tspan>, because panels are stacked.</text>

  <rect x="500" y="508" width="190" height="44" rx="8" class="surface" stroke-width="1.5"/>
  <text x="514" y="526" class="muted" font-size="10" font-weight="600">TOP PANEL</text>
  <rect x="612" y="516" width="62" height="28" rx="5" class="win" stroke-width="1.5"/>
  <rect x="500" y="562" width="190" height="44" rx="8" class="surface" stroke-width="1.5"/>
  <text x="514" y="580" class="muted" font-size="10" font-weight="600">BOTTOM PANEL</text>
  <path d="M 720 582 L 720 534" class="arrow" stroke-width="2.2" fill="none"/>
  <polygon points="714,538 720,524 726,538" class="arrowhead"/>
  <text x="742" y="552" class="peach mono" font-size="12.5" font-weight="700">same desktop,</text>
  <text x="742" y="572" class="peach mono" font-size="12.5" font-weight="700">other panel</text>
</svg>
